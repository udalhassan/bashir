<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NKIRI - Downloads</title>
  <style>
    :root {
      --brand-blue: #6bb6f6;
      --text-dark: #1a1a1a;
      --text-muted: #6b7280;
      --surface: #ffffff;
      --bg: #fafafa;
      --border: #e5e7eb;
      --accent: #111827;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      padding: 0;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text-dark);
      background: var(--bg);
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .diamond {
      width: 90px;
      height: 90px;
      background: var(--brand-blue);
      transform: rotate(45deg);
      display: grid;
      place-items: center;
      border-radius: 10px;
    }
    .diamond span {
      transform: rotate(-45deg);
      font-weight: 800;
      font-size: 30px;
      color: #0b0b0b;
      letter-spacing: 1px;
    }

    .menu {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      padding: 8px 10px;
      border-radius: 10px;
    }
    .menu:active { background: #f3f4f6; }

    .hamburger {
      width: 22px;
      height: 16px;
      position: relative;
    }
    .hamburger i,
    .hamburger i::before,
    .hamburger i::after {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      content: "";
      display: block;
      border-radius: 2px;
    }
    .hamburger i { top: 7px; }
    .hamburger i::before { top: -7px; }
    .hamburger i::after { top: 7px; }

    /* Hero spacing (white space below header like screenshot) */
    .spacer-xl { height: 28px; }

    /* Ad banners */
    .ad-stack { display: grid; gap: 18px; margin: 12px 0 28px; }
    .ad-banner {
      width: 100%;
      border-radius: var(--radius);
      height: 88px;
      background: linear-gradient(90deg, #f0c1d8, #8ec5ff 45%, #2b65c5);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .ad-banner::after {
      content: "Advertisement";
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 12px;
      color: white;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    /* Search */
    .search-block { margin: 8px 0 6px; }
    .search-label {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 0 14px;
    }
    .searchbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .searchbar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-dark);
      background: transparent;
    }
    .searchbar input::placeholder { color: var(--text-muted); }

    /* Section title */
    .section-title {
      font-size: clamp(28px, 4vw, 56px);
      line-height: 1.1;
      font-weight: 800;
      margin: 28px 0 12px;
      letter-spacing: 0.5px;
    }

    /* Cards grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px 24px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .poster {
      width: 100%;
      aspect-ratio: 3/4;
      background: #e5e7eb;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 14px 14px 18px; }
    .card-title { font-weight: 800; font-size: 18px; margin-bottom: 6px; }
    .card-meta { color: var(--text-muted); font-size: 14px; }

    footer { color: var(--text-muted); font-size: 14px; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo-wrap">
        <div class="diamond"><span>NKIRI</span></div>
      </div>
      <div class="menu" aria-label="Open menu" role="button" tabindex="0">
        <span class="hamburger" aria-hidden="true"><i></i></span>
        <span>Menu</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="spacer-xl"></div>

    <div class="ad-stack" aria-label="ads">
      <div class="ad-banner"></div>
      <div class="ad-banner"></div>
    </div>

    <section class="search-block" aria-labelledby="search-label">
      <h2 id="search-label" class="search-label">Search for what to download here</h2>
      <label class="searchbar" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm8.7 14.3-3.1-3.1" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" placeholder="Search Here" />
      </label>
    </section>

    <h1 class="section-title">Popular Downloads</h1>

    <section class="grid" aria-label="Popular downloads">
      <article class="card">
        <img class="poster" alt="Squid Game 2 poster" src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=800&auto=format&fit=crop" />
        <div class="card-body">
          <div class="card-title">Squid Game 2</div>
          <div class="card-meta">Series • Action, Thriller</div>
        </div>
      </article>

      <article class="card">
        <img class="poster" alt="The Judge From Hell poster" src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963f?q=80&w=800&auto=format&fit=crop" />
        <div class="card-body">
          <div class="card-title">The Judge From Hell</div>
          <div class="card-meta">Series • Fantasy, Crime</div>
        </div>
      </article>
    </section>

    <footer>&copy; 2025 NKIRI. For demo UI purposes.</footer>
  </main>
</body>
</html>
